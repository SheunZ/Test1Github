<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Neon Abyss</title>
<style>
  :root { --bg: #030814; }
  html, body { margin: 0; height: 100%; background: var(--bg); overflow: hidden; }
  canvas { display: block; width: 100vw; height: 100vh; }
  #clock {
    position: fixed; inset: 11vh 0 auto 0; text-align: center; color: #e8f6ff;
    font: 200 clamp(56px, 22vw, 140px)/1 "Helvetica Neue", "SF Pro Display", system-ui, sans-serif;
    letter-spacing: .02em; text-shadow: 0 0 18px rgba(0, 229, 255, .55); display: none;
  }
  #clock small { display: block; margin-top: 14px; font-size: .16em; font-weight: 400;
    letter-spacing: .25em; text-transform: uppercase; opacity: .7; text-shadow: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="clock"><span id="time"></span><small id="date"></small></div>
<script>
/*
 * Fond d'écran animé "Neon Abyss".
 *   ?mode=home  → fond d'écran d'accueil (deux rubans néon croisés)
 *   ?mode=lock  → écran de verrouillage (ruban bas, haut dégagé pour l'horloge)
 *   ?clock=1    → affiche une horloge d'aperçu (mode lock)
 *   ?render=1   → pas d'animation auto ; renderFrame(t) piloté par render.mjs
 * Toute l'animation est une fonction de la phase p ∈ [0,1) : la boucle est parfaite.
 */
const params = new URLSearchParams(location.search);
const MODE = params.get('mode') === 'lock' ? 'lock' : 'home';
const LOOP_SECONDS = 12;
const TAU = Math.PI * 2;

const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const glow = document.createElement('canvas');
const gctx = glow.getContext('2d');
let W, H, stars;

function rand(seed) {
  return () => ((seed = (seed * 16807) % 2147483647) - 1) / 2147483646;
}

function resize() {
  const dpr = params.has('render') ? 1 : Math.min(window.devicePixelRatio || 1, 2);
  W = canvas.width = glow.width = Math.round(innerWidth * dpr);
  H = canvas.height = glow.height = Math.round(innerHeight * dpr);
  const r = rand(7);
  stars = Array.from({ length: Math.round(W * H / 9000) }, () => ({
    x: r() * W, y: r() * H, s: 0.4 + r() * 1.3,
    f: 1 + Math.floor(r() * 3), o: r() * TAU, a: 0.15 + r() * 0.45,
  }));
}

const RIBBONS = {
  home: [
    { y: 0.40, angle: -0.42, amp: 0.10, strands: 34, spread: 0.06, hue: [190, 215], speed: 1, alpha: 0.55 },
    { y: 0.66, angle: 0.30, amp: 0.08, strands: 26, spread: 0.05, hue: [220, 265], speed: -1, alpha: 0.42 },
  ],
  lock: [
    { y: 0.78, angle: -0.18, amp: 0.07, strands: 36, spread: 0.055, hue: [188, 225], speed: 1, alpha: 0.55 },
    { y: 0.86, angle: 0.08, amp: 0.05, strands: 18, spread: 0.035, hue: [235, 270], speed: -1, alpha: 0.35 },
  ],
}[MODE];

function drawBackground(p) {
  const g = ctx.createLinearGradient(0, 0, W * 0.3, H);
  g.addColorStop(0, '#020611');
  g.addColorStop(0.55, '#06122b');
  g.addColorStop(1, '#030a1c');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);

  // halo central qui respire lentement
  const cx = W * (MODE === 'lock' ? 0.5 : 0.55);
  const cy = H * (MODE === 'lock' ? 0.82 : 0.5);
  const R = Math.max(W, H) * (0.55 + 0.04 * Math.sin(p * TAU));
  const h = ctx.createRadialGradient(cx, cy, 0, cx, cy, R);
  h.addColorStop(0, 'rgba(20, 70, 170, 0.32)');
  h.addColorStop(0.5, 'rgba(10, 35, 95, 0.12)');
  h.addColorStop(1, 'rgba(0, 0, 0, 0)');
  ctx.fillStyle = h;
  ctx.fillRect(0, 0, W, H);

  for (const s of stars) {
    const tw = 0.5 + 0.5 * Math.sin(p * TAU * s.f + s.o);
    ctx.fillStyle = `rgba(170, 220, 255, ${s.a * tw})`;
    ctx.beginPath();
    ctx.arc(s.x + 6 * Math.sin(p * TAU + s.o), s.y + 6 * Math.cos(p * TAU + s.o), s.s, 0, TAU);
    ctx.fill();
  }
}

function drawRibbon(c, rb, p, widthScale) {
  const diag = Math.hypot(W, H);
  const phase = p * TAU * rb.speed;
  c.save();
  c.translate(W / 2, H * rb.y);
  c.rotate(rb.angle);
  c.globalCompositeOperation = 'lighter';
  const steps = 90;
  for (let i = 0; i < rb.strands; i++) {
    const k = i / (rb.strands - 1);
    const hue = rb.hue[0] + (rb.hue[1] - rb.hue[0]) * k;
    const edge = Math.sin(k * Math.PI); // brins centraux plus lumineux
    c.strokeStyle = `hsla(${hue}, 100%, ${58 + 14 * edge}%, ${rb.alpha * (0.25 + 0.75 * edge)})`;
    c.lineWidth = (0.7 + 1.1 * edge) * widthScale * (W / 1080);
    c.beginPath();
    for (let s = 0; s <= steps; s++) {
      const u = s / steps;
      const x = (u - 0.5) * diag * 1.2;
      const y = diag * (
        rb.amp * Math.sin(u * 5.2 + phase + k * 1.4) * 0.6 +
        rb.amp * Math.sin(u * 2.3 - phase * 2 + k * 0.6) * 0.4 +
        rb.spread * (k - 0.5) * (1 + 0.6 * Math.sin(u * 3.1 + phase + 1.3))
      );
      s ? c.lineTo(x, y) : c.moveTo(x, y);
    }
    c.stroke();
  }
  c.restore();
}

function drawScanline(p) {
  // fine ligne fluo qui balaie l'horizon (accent subtil)
  const y = H * (MODE === 'lock' ? 0.62 : 0.5);
  const x = ((p * 1.0) % 1) * (W * 1.6) - W * 0.3;
  const g = ctx.createLinearGradient(x - W * 0.35, 0, x + W * 0.35, 0);
  g.addColorStop(0, 'rgba(0, 229, 255, 0)');
  g.addColorStop(0.5, 'rgba(120, 240, 255, 0.55)');
  g.addColorStop(1, 'rgba(0, 229, 255, 0)');
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  ctx.fillStyle = g;
  ctx.fillRect(0, y, W, Math.max(1, W / 900));
  ctx.restore();
}

function vignette() {
  const v = ctx.createRadialGradient(W / 2, H / 2, Math.min(W, H) * 0.3, W / 2, H / 2, Math.max(W, H) * 0.75);
  v.addColorStop(0, 'rgba(0,0,0,0)');
  v.addColorStop(1, 'rgba(0,0,0,0.6)');
  ctx.fillStyle = v;
  ctx.fillRect(0, 0, W, H);
  if (MODE === 'lock') {
    // assombrit le haut pour la lisibilité de l'horloge
    const t = ctx.createLinearGradient(0, 0, 0, H * 0.45);
    t.addColorStop(0, 'rgba(1,4,12,0.55)');
    t.addColorStop(1, 'rgba(1,4,12,0)');
    ctx.fillStyle = t;
    ctx.fillRect(0, 0, W, H * 0.45);
  }
}

function renderFrame(p) {
  p = ((p % 1) + 1) % 1;
  drawBackground(p);

  // passe "glow" : rubans épais floutés
  gctx.clearRect(0, 0, W, H);
  for (const rb of RIBBONS) drawRibbon(gctx, rb, p, 3.5);
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  ctx.filter = `blur(${Math.round(W / 70)}px)`;
  ctx.globalAlpha = 0.9;
  ctx.drawImage(glow, 0, 0);
  ctx.restore();

  // passe nette
  for (const rb of RIBBONS) drawRibbon(ctx, rb, p, 1);
  drawScanline(p);
  vignette();
}
window.renderFrame = renderFrame;

function tickClock() {
  const d = new Date();
  document.getElementById('time').textContent =
    d.toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' });
  document.getElementById('date').textContent =
    d.toLocaleDateString('fr-FR', { weekday: 'long', day: 'numeric', month: 'long' });
}

resize();
addEventListener('resize', resize);
if (MODE === 'lock' && params.get('clock') === '1') {
  document.getElementById('clock').style.display = 'block';
  tickClock();
  setInterval(tickClock, 1000);
}
if (!params.has('render')) {
  const loop = (ms) => { renderFrame(ms / 1000 / LOOP_SECONDS); requestAnimationFrame(loop); };
  requestAnimationFrame(loop);
} else {
  renderFrame(0);
}
</script>
</body>
</html>
